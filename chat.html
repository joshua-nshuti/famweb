<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Family Chat</title>

<link rel="icon" type="image/png" href="/favicon.png">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: white;

    display: flex;
    flex-direction: column;
    height: 100vh;
}

header {
    padding: 15px;
    text-align: center;
    background: rgba(255,255,255,0.1);
}

#chatBox {
    flex: 1;
    overflow-y: auto;
    padding: 15px;

    display: flex;
    flex-direction: column;
}

.msg {
    max-width: 70%;
    padding: 10px;
    margin: 5px 0;
    border-radius: 15px;
    word-wrap: break-word;
    display: flex;
    gap: 10px;
}

.me {
    background: #00c6ff;
    align-self: flex-end;
}

.other {
    background: rgba(255,255,255,0.15);
    align-self: flex-start;
}

.avatar {
    width: 35px;
    height: 35px;
    border-radius: 50%;
    background: orange;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.msgContent {
    flex: 1;
}

.reply {
    font-size: 12px;
    opacity: 0.7;
    border-left: 3px solid #00c6ff;
    padding-left: 5px;
    margin-bottom: 3px;
}

.time {
    font-size: 10px;
    opacity: 0.6;
    margin-top: 3px;
}

.inputBox {
    padding: 10px;
    background: rgba(255,255,255,0.1);
}

.inputRow {
    display: flex;
}

input {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
}

button {
    margin-left: 10px;
    padding: 12px;
    border: none;
    background: #00c6ff;
    color: white;
    border-radius: 10px;
}

#replyBox {
    display: none;
    background: #222;
    padding: 5px;
    font-size: 12px;
}

@media (max-width: 768px) {
    .msg {
        max-width: 85%;
        font-size: 14px;
    }
}

</style>
</head>

<body>

<header>
    <h2>👨‍👩‍👧 Family Chat</h2>
</header>

<div id="chatBox"></div>

<div id="replyBox">
    Replying: <span id="replyText"></span>
    <button onclick="cancelReply()">X</button>
</div>

<div class="inputBox">
    <div class="inputRow">
        <input type="text" id="message" placeholder="Type message...">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBUgbG6HIZtNLd1hQUYFQ0HMCX-T9lRK68",
  authDomain: "blessed-family.firebaseapp.com",
  projectId: "blessed-family",
  storageBucket: "blessed-family.firebasestorage.app",
  messagingSenderId: "740317421666",
  appId: "1:740317421666:web:3431d27fc2db835b5e713b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let replyingTo = null;

onAuthStateChanged(auth, (user) => {
    if (!user) {
        window.location.href = "login.html";
    } else {
        currentUser = user;
        loadMessages();
    }
});

window.sendMessage = async function(){

    let input = document.getElementById("message");
    let text = input.value.trim();

    if(!text) return;

    await addDoc(collection(db, "messages"), {
        text: text,
        user: currentUser.email,
        time: serverTimestamp(),
        reply: replyingTo
    });

    input.value = "";
    cancelReply();
}

function loadMessages(){

    const q = query(collection(db, "messages"), orderBy("time"));

    onSnapshot(q, (snapshot) => {

        let chatBox = document.getElementById("chatBox");
        chatBox.innerHTML = "";

        snapshot.forEach(doc => {

            let msg = doc.data();
            let isMe = msg.user === currentUser.email;
            let initials = msg.user.charAt(0).toUpperCase();

            let time = msg.time?.toDate
                ? msg.time.toDate().toLocaleTimeString()
                : "";

            chatBox.innerHTML += `
            <div class="msg ${isMe ? 'me' : 'other'}" onclick="setReply('${msg.text}')">

                <div class="avatar">${initials}</div>

                <div class="msgContent">

                    ${msg.reply ? `<div class="reply">↪ ${msg.reply}</div>` : ""}

                    <b>${msg.user}</b><br>
                    ${msg.text}

                    <div class="time">${time}</div>

                </div>
            </div>
            `;
        });

        chatBox.scrollTop = chatBox.scrollHeight;
    });
}

window.setReply = function(text){
    replyingTo = text;
    document.getElementById("replyBox").style.display = "block";
    document.getElementById("replyText").innerText = text;
}

window.cancelReply = function(){
    replyingTo = null;
    document.getElementById("replyBox").style.display = "none";
}

document.getElementById("message").addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        sendMessage();
    }
});

</script>

<footer>
    <p>© 2026 Josh Family</p>
    <p>for more imfo call: joshuanshuti033@gmail.com</p>
</footer>

</body>
</html>
